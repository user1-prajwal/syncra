name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: collab-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: collab-backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collab-editor-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collab-editor-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Browser end-to-end tests (real Chromium)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15 # a hung browser test must never keep the job running for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend, frontend and e2e dependencies
        run: |
          npm ci --prefix collab-backend
          npm ci --prefix collab-editor-frontend
          npm ci --prefix e2e
      - name: Run browser tests
        run: npm test --prefix e2e
      - name: Upload screenshots and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: e2e/artifacts
          if-no-files-found: ignore
